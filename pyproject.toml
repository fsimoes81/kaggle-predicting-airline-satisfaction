[project]
name = "kaggle-predicting-airline-satisfaction"
version = "0.1.0"
description = "Solução para a competição Kaggle Playground Series Season 6 Episode 10 - Predicting Airline Satisfaction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "lightgbm>=4.7.0",
    "xgboost>=2.0.0",
    "catboost>=1.2.0",
    "optuna>=3.6.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "ipython>=8.22.0",
    "rich>=13.7.0",
    "jupytext>=1.16.0",
    "ptpython>=3.0.26",
    "jupyterlab>=4.1.0",
    "ipykernel>=6.29.0",
    "notebook>=7.1.0",
    "python-dotenv>=1.0.1",
    "tqdm>=4.66.0",
    "kaggle>=1.6.0",
    "joblib>=1.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
